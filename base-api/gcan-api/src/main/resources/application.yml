spring:
  application:
    name: gcan-api
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/base_project?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  port: 8081

gcan:
  tcp:
    port: 8000
  frame-stale-threshold-ms: 10000
  dictionary:
    base-url: ${GCAN_SYSTEM_API_URL:http://localhost:8080}
    endpoint: /api/open/gcan/v1/dictionaries
    refresh-interval-ms: 60000
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
  mirror:
    enabled: ${GCAN_MIRROR_ENABLED:false}
    base-url: ${GCAN_MIRROR_BASE_URL:}
    endpoint: /api/open/gcan/v1/raw-frame/current
    poll-interval-ms: ${GCAN_MIRROR_POLL_INTERVAL_MS:1000}
    connect-timeout-ms: ${GCAN_MIRROR_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${GCAN_MIRROR_READ_TIMEOUT_MS:2000}
    box-ids: ${GCAN_MIRROR_BOX_IDS:}
    can-ids: ${GCAN_MIRROR_CAN_IDS:}
  history:
    enabled: true
    store-interval-ms: 3000
    included-can-ids:
      - 08F200A0
      - 1811A6A0
      - 1836FF30
      - 0C10A7F0
      - 043C9CF4
      - 1830D02C
      - 043D9CF4
      - 1840FF30
      - 1846FF30

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

---
spring:
  config:
    activate:
      on-profile: dev

app:
  cors:
    allowed-origins: "*"

---
spring:
  config:
    activate:
      on-profile: prod

app:
  cors:
    allowed-origins: "*"
